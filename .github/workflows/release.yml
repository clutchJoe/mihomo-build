name: Build Mihomo

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Mihomo version, e.g. v1.19.31. Leave empty for latest."
        required: false
        type: string

  schedule:
    # UTC 16:30 = UTC+8 00:30
    - cron: "30 16 * * *"

permissions:
  contents: write

env:
  GO_VERSION: "1.26"

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
      buildtime: ${{ steps.buildinfo.outputs.buildtime }}

    steps:
      - name: Get upstream version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(curl -fsSL \
              https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
              | jq -r '.tag_name')
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Upstream version: $VERSION"

      - name: Set build information
        id: buildinfo
        run: |
          BUILDTIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          echo "buildtime=$BUILDTIME" >> "$GITHUB_OUTPUT"
          echo "Build time: $BUILDTIME"

      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" \
            --repo "${{ github.repository }}" >/dev/null 2>&1; then

            echo "Release $VERSION already exists."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $VERSION does not exist."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi


  build:
    needs: prepare

    if: needs.prepare.outputs.should_build == 'true'

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            goamd64: v1
            name: linux-amd64

          - goos: linux
            goarch: amd64
            goamd64: v3
            name: linux-amd64-v3

          - goos: linux
            goarch: arm64
            name: linux-arm64

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Mihomo
        uses: actions/checkout@v6
        with:
          repository: MetaCubeX/mihomo
          ref: ${{ needs.prepare.outputs.version }}
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: ${{ env.GO_VERSION }}

      - name: Verify Go toolchain
        run: |
          go version
          go env GOROOT
          go env GOVERSION

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
          CGO_ENABLED: 0
          GOTOOLCHAIN: local
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILDTIME: ${{ needs.prepare.outputs.buildtime }}
        run: |
          go build \
            -tags "no_easytier" \
            -trimpath \
            -ldflags "\
              -extldflags --static \
              -X github.com/metacubex/mihomo/constant.Version=${VERSION} \
              -X github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME} \
              -w -s -buildid=" \
            -o mihomo-${{ matrix.name }}

      - name: Verify binary
        run: |
          echo "Binary information:"
          file mihomo-${{ matrix.name }}

          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            echo
            echo "Mihomo version:"
            ./mihomo-${{ matrix.name }} -v
          else
            echo
            echo "Skipping execution for cross-compiled ${{ matrix.goarch }} binary."
          fi

      - name: Compress
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tar -czf mihomo-${VERSION}-${{ matrix.name }}.tar.gz \
            mihomo-${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mihomo-${{ matrix.name }}
          path: mihomo-${{ needs.prepare.outputs.version }}-${{ matrix.name }}.tar.gz


  release:
    needs:
      - prepare
      - build

    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts

          echo "Release files:"
          ls -lh

          sha256sum *.tar.gz > SHA256SUMS

          echo
          echo "SHA256 checksums:"
          cat SHA256SUMS

      - name: Generate release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILDTIME: ${{ needs.prepare.outputs.buildtime }}
        run: |
          cat > release-notes.md <<EOF
          Custom build of [MetaCubeX/mihomo](https://github.com/MetaCubeX/mihomo) ${VERSION}.

          ## Build information

          | Item | Value |
          | --- | --- |
          | Mihomo version | ${VERSION} |
          | Go version | Go ${GO_VERSION} |
          | Go toolchain | MetaCubeX/go |
          | CGO | Disabled |
          | Build tags | \`no_easytier\` |
          | Tailscale | Not included |
          | EasyTier | Not included |
          | gVisor build tag | Not enabled |
          | Build time | ${BUILDTIME} |
          | Source | MetaCubeX/mihomo ${VERSION} |
          | Packaging | tar.gz |

          ## Builds

          - Linux AMD64 (x86-64 v1)
          - Linux AMD64 v3
          - Linux ARM64

          ## Notes

          This build follows the Mihomo upstream build environment where practical, including the MetaCubeX Go toolchain and static linking settings.

          Differences from the official standard Mihomo build:

          - \`with_gvisor\` is not enabled, excluding Tailscale-related functionality.
          - \`no_easytier\` is enabled, excluding EasyTier-related functionality.

          SHA256 checksums are included in \`SHA256SUMS\`.
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$VERSION" \
            artifacts/* \
            --repo "${{ github.repository }}" \
            --title "$VERSION" \
            --notes-file release-notes.md
